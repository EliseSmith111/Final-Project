<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disney Princess Snake Game</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to right, #fceff9, #ffe3f0);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #d63384;
      margin: 20px;
    }

    canvas {
      border: 5px solid #ffb6c1;
      background-color: #fff0f5;
      box-shadow: 0 0 20px pink;
    }

    #score {
      font-size: 1.2rem;
      margin-top: 10px;
      color: #8e44ad;
    }

    #princess {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>👑 Princess Snake Game 👑</h1>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="score">Score: 0</div>
  <div id="princess"></div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const box = 20;
    let score = 0;
    let princessImages = ['👸 Cinderella', '👸 Ariel', '👸 Belle', '👸 Moana', '👸 Tiana'];
    let currentPrincess = '';

    let snake = [];
    snake[0] = { x: 9 * box, y: 10 * box };

    let food = {
      x: Math.floor(Math.random() * 19 + 1) * box,
      y: Math.floor(Math.random() * 19 + 1) * box
    };

    let direction;

    document.addEventListener('keydown', setDirection);

    function setDirection(e) {
      if (e.key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT';
      else if (e.key === 'ArrowUp' && direction !== 'DOWN') direction = 'UP';
      else if (e.key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';
      else if (e.key === 'ArrowDown' && direction !== 'UP') direction = 'DOWN';
    }

    function draw() {
      ctx.fillStyle = "#fff0f5";
      ctx.fillRect(0, 0, 400, 400);

      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? '#ff69b4' : '#ffaec9';
        ctx.fillRect(snake[i].x, snake[i].y, box, box);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(snake[i].x, snake[i].y, box, box);
      }

      ctx.fillStyle = '#d63384';
      ctx.fillRect(food.x, food.y, box, box);

      let snakeX = snake[0].x;
      let snakeY = snake[0].y;

      if (direction === 'LEFT') snakeX -= box;
      if (direction === 'UP') snakeY -= box;
      if (direction === 'RIGHT') snakeX += box;
      if (direction === 'DOWN') snakeY += box;

      if (snakeX === food.x && snakeY === food.y) {
        score++;
        currentPrincess = princessImages[Math.floor(Math.random() * princessImages.length)];
        food = {
          x: Math.floor(Math.random() * 19 + 1) * box,
          y: Math.floor(Math.random() * 19 + 1) * box
        };
      } else {
        snake.pop();
      }

      const newHead = { x: snakeX, y: snakeY };

      if (
        snakeX < 0 || snakeX >= 400 || snakeY < 0 || snakeY >= 400 ||
        collision(newHead, snake)
      ) {
        clearInterval(game);
        alert(`Game Over! Final score: ${score}`);
      }

      snake.unshift(newHead);

      document.getElementById('score').innerText = 'Score: ' + score;
      document.getElementById('princess').innerText = currentPrincess;
    }

    function collision(head, array) {
      for (let i = 0; i < array.length; i++) {
        if (head.x === array[i].x && head.y === array[i].y) return true;
      }
      return false;
    }

    const game = setInterval(draw, 120);
  </script>
</body>
</html>
